# 模型别名：把客户端发来的任意模型名（Codex CLI / Claude Code 会发 gpt-* 、claude-* 等）
# 映射到上面 [models.*] 里已启用的 id。键不区分大小写。
[model_aliases]
"gpt-5" = "deepseek-v4-flash-de"
"claude-sonnet-4-5" = "deepseek-v4-pro-de"

# 默认模型：model 和 model_aliases 都没命中时降级到此模型（留空 = 未知模型仍 404）。
# 注意：别名解析是尽力而为的兼容手段，显式配置别名优于依赖降级。
# default_model = "deepseek-v4-flash-de"
